# Render.com Blueprint — one-click-ish deploy of the backend + Postgres + Redis.
# Render's managed Postgres supports pgvector (the app runs CREATE EXTENSION on
# startup). The frontend is best deployed on Vercel (see README), pointed at the
# backend URL via VITE_API_BASE.
#
# Heads-up: Render renames/retunes plan names over time and free tiers expire —
# treat this as a starting point and confirm in the dashboard.

databases:
  - name: docvault-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: docvault-redis
    plan: free
    ipAllowList: [] # only reachable from Render services

  - type: web
    name: docvault-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter # embeddings need >512MB RAM; free tier may OOM on model load
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false # set this secret in the dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: docvault-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: docvault-redis
          property: connectionString
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIM
        value: "384"
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false # set to your deployed frontend origin, e.g. https://docvault.vercel.app
