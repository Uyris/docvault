# Serves the built SPA and reverse-proxies API calls to the backend container,
# so the browser only ever talks to one origin (no CORS in the compose setup).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API + probes to the backend service (compose DNS name "backend").
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA fallback — let client-side routing handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
